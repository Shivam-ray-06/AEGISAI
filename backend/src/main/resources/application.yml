server:
  port: 8085

spring:
  application:
    name: aegisai-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

aegisai:
  storage:
    base-dir: /Volumes/Krishu/AEGISAI/storage
    uploads: /Volumes/Krishu/AEGISAI/storage/uploads
    processed: /Volumes/Krishu/AEGISAI/storage/processed
    reports: /Volumes/Krishu/AEGISAI/storage/reports
    thumbnails: /Volumes/Krishu/AEGISAI/storage/thumbnails
    test-videos: /Volumes/Krishu/AEGISAI/storage/test_videos
  ai-service:
    url: http://localhost:8000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Development Profile (H2 local fast fallback)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:/Volumes/Krishu/AEGISAI/storage/aegisai_h2_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Production Profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/aegisai
    username: aegisai
    password: aegisai_secure_pass_2026
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
